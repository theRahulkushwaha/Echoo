services:
  mongodb:
    image: mongo:7
    container_name: echoo-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: echoo-backend
    restart: always
    ports:
      - "0.0.0.0:3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/Echoo
    depends_on:
      - mongodb

volumes:
  mongodb_data:
